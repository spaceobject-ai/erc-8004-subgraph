specVersion: 1.3.0
schema:
  file: ../../schema.graphql
features:
  - fullTextSearch
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: IdentityRegistry
    network: {{network}}
    source:
      address: "{{identityAddress}}"
      abi: IdentityRegistry
      startBlock: {{identityStartBlock}}
    context:
      chainId:
        type: BigInt
        data: "{{chainId}}"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Account
        - IdentityRegistry
        - Agent
        - AgentMetadata
        - OperatorApproval
        - AgentURIRevision
        - AgentTransfer
        - AgentApprovalChange
        - OperatorApprovalChange
        - AgentMetadataRevision
      abis:
        - name: IdentityRegistry
          file: ../../abis/IdentityRegistry.json
      eventHandlers:
        - event: Registered(indexed uint256,string,indexed address)
          handler: handleRegistered
        - event: MetadataSet(indexed uint256,indexed string,string,bytes)
          handler: handleMetadataSet
        - event: URIUpdated(indexed uint256,string,indexed address)
          handler: handleURIUpdated
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: Approval(indexed address,indexed address,indexed uint256)
          handler: handleApproval
        - event: ApprovalForAll(indexed address,indexed address,bool)
          handler: handleApprovalForAll
      file: ../../src/mapping.ts
  - kind: ethereum
    name: ReputationRegistry
    network: {{network}}
    source:
      address: "{{reputationAddress}}"
      abi: ReputationRegistry
      startBlock: {{reputationStartBlock}}
    context:
      chainId:
        type: BigInt
        data: "{{chainId}}"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Account
        - ReputationRegistry
        - Agent
        - Feedback
        - FeedbackResponse
        - FeedbackMetricPoint
      abis:
        - name: ReputationRegistry
          file: ../../abis/ReputationRegistry.json
      eventHandlers:
        - event: NewFeedback(indexed uint256,indexed address,uint64,int128,uint8,indexed string,string,string,string,string,bytes32)
          handler: handleNewFeedback
        - event: FeedbackRevoked(indexed uint256,indexed address,indexed uint64)
          handler: handleFeedbackRevoked
        - event: ResponseAppended(indexed uint256,indexed address,uint64,indexed address,string,bytes32)
          handler: handleResponseAppended
      file: ../../src/mapping.ts

